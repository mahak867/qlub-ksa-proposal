name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qlub
          POSTGRES_PASSWORD: qlub
          POSTGRES_DB: qlubpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qlub" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qlub:qlub@localhost:5432/qlubpay_test
      TEST_DATABASE_URL: postgresql://qlub:qlub@localhost:5432/qlubpay_test
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qlub-pay/core build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
